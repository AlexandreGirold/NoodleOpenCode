# Production workload intent. Managed dependencies and gateway are not supplied here.
apiVersion: v1
kind: Namespace
metadata: {name: prod}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api, namespace: prod}
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: api
          image: example/jobs-api:1
          ports: [{name: http, containerPort: 8000}]
          env:
            - {name: PGHOST, value: postgres.prod.svc.cluster.local}
            - {name: PGPORT, value: "5432"}
            - {name: PGPASSWORD, valueFrom: {secretKeyRef: {name: database, key: password}}}
            - {name: REDIS_URL, value: 'redis://redis.prod.svc.cluster.local:6379'}
---
apiVersion: v1
kind: Service
metadata: {name: api, namespace: prod}
spec:
  selector: {app: api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: prod}
spec:
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      containers:
        - name: worker
          image: example/jobs-worker:1
          env:
            - {name: REDIS_URL, value: 'redis://redis.prod.svc.cluster.local:6379'}
            - {name: VALIDATION_URL, value: 'https://validation.example/jobs'}
